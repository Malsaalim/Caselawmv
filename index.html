    <h1>ދިވެހިރާއްޖޭގެ ކޯޓުތަކުގެ ނިންމުންތަކާއި ޤާނޫނީ އުސޫލުތައް</h1>
    <p>ކޯޓުތަކުން ނިންމާފައިވާ މުހިންމު މައްސަލަތަކާއި، އެ ނިންމުންތަކުން ކަނޑައެޅިފައިވާ ޤާނޫނީ އުސޫލުތައް އެއްތަނަކުން ކިޔައި ހޯދުމުގެ ފުރުޞަތު.</p>
    <p class="hint" style="margin-top:10px">ސުޕްރީމް ކޯޓުގެ <a href="https://www.supremecourt.mv/case-registry/judgments" target="_blank" rel="noopener">ނިންމުންތަކުގެ ރަޖިސްޓަރީ</a> އާ ގުޅިފައި، ކޮންމެ ދުވަހަކު އަޕްޑޭޓް ކުރެވޭ.</p>

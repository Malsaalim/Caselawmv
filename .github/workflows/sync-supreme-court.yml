name: Sync Supreme Court judgments
on:
  schedule:
    - cron: "47 23 * * *"   # every day ~04:47 Maldives time
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/sync_sc.py", ".github/workflows/sync-supreme-court.yml"]
permissions:
  contents: write
concurrency:
  group: sc-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests beautifulsoup4
      - name: Fetch judgment list
        run: |
          if [ -f data/sc-judgments.json ]; then python scripts/sync_sc.py; else python scripts/sync_sc.py --full; fi
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sc-judgments.json
          if git diff --cached --quiet; then echo "No new judgments"; exit 0; fi
          git commit -m "Sync Supreme Court judgments ($(date -u +%F))"
          git pull --rebase -q origin main
          git push origin HEAD:main

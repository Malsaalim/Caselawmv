name: Probe SC PDF access (temporary)
on:
  push:
    branches: [main]
    paths: [".github/workflows/probe-sc-pdf.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U=https://old.supremecourt.mv/storage/mv/sc-ninmunthah/hukum/2026sc37-2023sca13-aishath-aniya-v-contech-pvt-ltd.pdf
          curl -sS -o a.pdf -w 'plain %{http_code} %{content_type}\n' "$U" || true
          curl -sS -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36" -o b.pdf -w 'ua %{http_code} %{content_type}\n' "$U" || true
          curl -sS -o /dev/null -w 'highcourt %{http_code}\n' https://www.highcourt.gov.mv || true

name: SC discovery (one-off test)
on:
  push:
    paths: [".github/workflows/sc-discovery.yml", "scripts/probe_pdf.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils xvfb >/dev/null
          pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null
      - name: Probe PDF via browser
        run: |
          mkdir -p out
          xvfb-run -a python scripts/probe_pdf.py 2>&1 | tee out/log.txt || true
          file out/b.pdf | tee -a out/log.txt || true
          pdfinfo out/b.pdf >> out/log.txt 2>&1 || true
          pdffonts out/b.pdf >> out/log.txt 2>&1 || true
          pdftotext -layout out/b.pdf out/b.txt 2>>out/log.txt || true
      - name: Save to debug branch
        run: |
          cd out
          git init -q -b pipeline-debug
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "discovery output 2"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" pipeline-debug
